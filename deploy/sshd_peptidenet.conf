# PeptideNet production SSH policy. Installed as
# /etc/ssh/sshd_config.d/00-peptidenet-hardening.conf so these first-set values
# take precedence over the image defaults included later.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin prohibit-password

MaxAuthTries 3
LoginGraceTime 30
MaxSessions 4

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no
